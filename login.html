<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieFlix - Login</title>

    <link rel="stylesheet" href="CSS/style.css">

    <link rel="stylesheet" href="CSS/login.css">

    <script src="JS/formularios.js" defer></script>

</head>


<body>


    <header>

        <div class="logo">

            <img src="IMG/logo.jpg" alt="Logo">

            <div>

                <h2>MovieFlix</h2>

                <p>Aluguel de filmes</p>

            </div>

        </div>


        <nav>

            <a href="index.html">Início</a>

            <div class="menu-catalogo">

                <a href="produto.html">Catálogo</a>

                <div class="submenu">
                    <a href="#filmes">Filmes</a>
                    <a href="#avaliacoes">Avaliações</a>
                </div>

            </div>

            <a href="sobre.html">Sobre</a>

            <a href="contato.html">Contato</a>

            <a href="login.html">Login</a>

        </nav>

    </header>


    <main class="login-area">


        <div class="login">

            <h1>Login</h1>

            <p>Entre na sua conta.</p>


            <form>

                <label>Email</label>

                <input
                    type="email"
                    placeholder="Digite seu email"
                >


                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                >

                <button type="button" id="mostrarSenha">
                   Mostrar
                </button>
              
                <a href="dashbord.html">
                    <button type="button">Entrar</button>
                </a>

            </form>


            <p>
                Ainda não possui uma conta?
                <a href="cadastro.html">Cadastre-se</a>
            </p>

        </div>


    </main>


    <footer>

        <div>

            <h3>MovieFlix</h3>

            <p>Alugue.Assista.Avalie</p>

        </div>

        <div>

            <h3>Navegação</h3>

            <a href="index.html">Início</a>

            <a href="produto.html">Filmes</a>

            <a href="sobre.html">Sobre</a>

        </div>


        <div>

            <h3>Contato</h3>

            <p>contato@movieflix.com</p>

        </div>


        <p class="copyright">
            © 2026 MovieFlix
        </p>

    </footer>


</body>

</html>
