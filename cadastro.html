<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieFlix - Cadastro</title>

    <link rel="stylesheet" href="CSS/style.css">

    <link rel="stylesheet" href="CSS/cadastro.css">

</head>

<body>

    <header>

        <div class="logo">

            <img src="IMG/logo.jpg" alt="Logo">

            <div>

                <h2>MovieFlix</h2>

                <p>Aluguel de filmes</p>

            </div>

        </div>

        <nav>

            <a href="index.html">Início</a>

            <div class="menu-catalogo">

                <a href="produto.html">Catálogo</a>

                <div class="submenu">
                    <a href="#filmes">Filmes</a>
                    <a href="#avaliacoes">Avaliações</a>
                </div>

            </div>

            <a href="sobre.html">Sobre</a>

            <a href="contato.html">Contato</a>

            <a href="login.html">Login</a>

        </nav>


    </header>

    <main class="cadastro-area">


        <div class="cadastro">

            <h1>Cadastre-se</h1>

            <p>Crie sua conta.</p>


            <form>
                <label>Usuário</label>

                <input 
                    type="text"
                    placeholder="Digite seu nome"
                    >

                <label>Email</label>

                <input
                    type="email"
                    placeholder="Digite seu email"
                >


                <label>Senha</label>

                <input
                    type="password"
                    placeholder="Digite sua senha"
                >
              
                <a href="index.html">
                    <button type="button">Entrar</button>
                </a>

            </form>

        </div>


    </main>

    <footer>

        <div>

            <h3>MovieFlix</h3>

            <p>Alugue.Assista.Avalie.</p>

        </div>


        <div>

            <h3>Navegação</h3>

            <a href="index.html">Início</a>

            <a href="produto.html">Filmes</a>

            <a href="sobre.html">Sobre</a>

        </div>


        <div>

            <h3>Contato</h3>

            <p>contato@movieflix.com</p>

            <p>(81) 99999-9999</p>

        </div>


        <p class="copyright">
            © 2026 MovieFlix - Todos os direitos reservados.
        </p>

    </footer>
    
</body>

</html>
